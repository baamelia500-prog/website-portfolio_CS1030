<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Amelia's Portfolio</title>

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- My styles (must come after Bootstrap so they override it) -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid" style="margin-top:80px">

        <div id="nav-placeholder"></div>

        <main class="page-content">
            <h1 class="page-title">Contact Me!</h1>
            <p>I'm open to internships, collaborations and art commissions.
                Send me a message and I'll get back to you.</p>

            <div class="row">
                <div class="col-md-5 mb-4">
                    <ul class="list-group">
                        <li class="list-group-item"><i class="ri-mail-fill"></i> <a href="mailto:ba.amelia.500@gmail.com">ba.amelia.500@gmail.com <i class="ri-arrow-right-up-line"></i></a></li>
                        <li class="list-group-item"><i class="ri-phone-fill"></i> <a href="tel:+17208712412">(720) 871-2412 <i class="ri-arrow-right-up-line"></i></a></li>
                        <li class="list-group-item"><i class="ri-linkedin-box-fill"></i> <a href="https://www.linkedin.com/in/amelia-miller-74a510333/" target="_blank">LinkedIn <i class="ri-arrow-right-up-line"></i></a></li>
                    </ul>
                </div>

                <div class="col-md-7">
                    <form action="https://docs.google.com/forms/d/e/1FAIpQLSem9aBN2ZP2lkObyGo7sJdS1vZGzFmsIoakoiapTTKPcs9vwg/formResponse"
                        method="POST">
                
                        <div class="mb-3">
                            <label for="name" class="form-label">Name:</label>
                            <input type="text"
                                class="form-control"
                                id="name"
                                placeholder="Enter your name"
                                name="entry.2005620554"
                                required>
                        </div>
                
                        <div class="mb-3">
                            <label for="email" class="form-label">Email:</label>
                            <input type="email"
                                class="form-control"
                                id="email"
                                placeholder="Enter your email"
                                name="entry.1045781291"
                                required>
                        </div>
                
                        <div class="mb-3">
                            <label for="message" class="form-label">Message:</label>
                            <textarea class="form-control"
                                    rows="5"
                                    id="message"
                                    name="entry.1166974658"
                                    required></textarea>
                        </div>
                
                        <div class="form-check mb-3">
                            <label class="form-check-label">
                                <input class="form-check-input"
                                    type="checkbox"
                                    name="entry.839337160"
                                    value="Yes">
                                This is about an art commission
                            </label>
                        </div>
                
                        <button type="submit" class="hero-btn">Send</button>
                
                    </form>
                </div>

            </div>
        </main>

    </div>

    <script>
        // Load the shared nav bar from nav.html
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;

                // Highlight the link for the page we are on
                var page = window.location.pathname.split('/').pop() || 'index.html';
                document.querySelectorAll('.nav-links a').forEach(function (link) {
                    if (link.getAttribute('href') == page) {
                        link.classList.add('active');
                    }
                });
            });
    </script>
</body>

</html>
